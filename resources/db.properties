# ==============================================================================
# Library Management System - Database Configuration
# ==============================================================================
# Supported db.type: 'sqlite' (Embedded zero-config) or 'mysql' (Local MySQL 8.0 server)
db.type=sqlite
db.url=jdbc:sqlite:library.db

# MySQL Server 8.0 Settings (Switchable via '⚙ DB Settings' dialog in GUI)
db.host=localhost
db.port=3306
db.name=library_db
db.user=root
db.password=root

# Business Policy Configuration
policy.fine.per.day=1.00
policy.student.max.books=4
policy.student.loan.days=14
policy.faculty.max.books=10
policy.faculty.loan.days=30
policy.community.max.books=2
policy.community.loan.days=7
